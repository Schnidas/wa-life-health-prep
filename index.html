<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Washington Life & Health Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0c0e0d">
<style>
:root{
  --bg:#0c0e0d; --bg-2:#111413; --surface:#151917; --surface-2:#1b201d; --raise:#212723;
  --ink:#ece6d8; --ink-2:#b9b2a3; --ink-3:#7f7a6e; --line:#2a302c; --line-2:#3a423c;
  --brass:#d4a640; --brass-2:#a8801f; --brass-ink:#141007; --brass-wash:rgba(212,166,64,.09);
  --green:#3fa36b; --green-wash:rgba(63,163,107,.12); --blood:#c8463b; --blood-wash:rgba(200,70,59,.12);
  --teal:#3e9aa3; --teal-wash:rgba(62,154,163,.11); --plum:#a36fc2; --plum-wash:rgba(163,111,194,.11);
  --amber:#e0913a; --amber-wash:rgba(224,145,58,.12);
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"IBM Plex Sans","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15.5px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(212,166,64,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(62,154,163,.05),transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
::selection{background:var(--brass);color:var(--brass-ink)}
a{color:var(--brass);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- gate ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line-2);padding:40px 36px 32px;position:relative;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.gate-card::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);pointer-events:none}
.gate-seal{display:flex;align-items:center;gap:18px;margin-bottom:26px;padding-left:6px}
.gate-seal i{display:block;flex:none;width:26px;height:26px;border:1.5px solid var(--brass);transform:rotate(45deg)}
.gate-seal span{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
.gate-card h1{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;margin:0 0 6px;letter-spacing:-.01em}
.gate-card h1 em{color:var(--brass)}
.gate-card p{color:var(--ink-2);margin:0 0 26px;font-size:14px}
.field{width:100%;padding:13px 14px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);font:500 16px var(--mono);letter-spacing:.2em;outline:none}
.field::placeholder{letter-spacing:.12em;color:var(--ink-3);font-size:13px}
.field:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-wash)}
.check{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);margin:14px 0 20px}
.check input{accent-color:var(--brass)}
.err{color:var(--blood);font:12px var(--mono);margin-top:12px;min-height:18px;letter-spacing:.04em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:1px solid var(--line-2);background:transparent;color:var(--ink);
  font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--brass);color:var(--brass);text-decoration:none}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.primary:hover{background:#e6b955;color:var(--brass-ink)}
.btn.block{width:100%;padding:13px}
.btn.sm{padding:6px 10px;font-size:11px}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{border-color:var(--line-2);color:var(--ink)}

/* ---------- shell ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(12,14,13,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:stretch;gap:24px;padding:0 28px;height:58px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand i{width:16px;height:16px;border:1.5px solid var(--brass);transform:rotate(45deg);flex:none}
.brand b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.01em}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);border-left:1px solid var(--line-2);padding-left:12px}
nav.main{display:flex;margin-left:auto}
nav.main a{display:flex;align-items:center;padding:0 16px;color:var(--ink-2);font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;border-left:1px solid var(--line);position:relative}
nav.main a:last-child{border-right:1px solid var(--line)}
nav.main a:hover{color:var(--ink);background:var(--surface);text-decoration:none}
nav.main a.on{color:var(--brass)}
nav.main a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brass)}
main{max-width:1240px;margin:0 auto;padding:44px 28px 90px}
footer.foot{max-width:1240px;margin:0 auto;padding:22px 28px 44px;color:var(--ink-3);font:11px/1.6 var(--mono);letter-spacing:.04em;border-top:1px solid var(--line)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;border:1px solid var(--line);background:var(--surface);margin-bottom:56px;position:relative}
.hero::before{content:"";position:absolute;top:-1px;left:-1px;width:120px;height:3px;background:var(--brass)}
.hero-l{padding:44px 44px 40px;border-right:1px solid var(--line)}
.hero-l .label{color:var(--brass);margin-bottom:22px;display:block}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6.4vw,84px);line-height:.95;margin:0 0 22px;letter-spacing:-.02em}
.hero h1 em{color:var(--brass)}
.hero p{color:var(--ink-2);margin:0;max-width:520px;font-size:15px}
.hero-r{display:flex;flex-direction:column}
.fact{display:flex;justify-content:space-between;align-items:baseline;padding:16px 26px;border-bottom:1px solid var(--line);gap:16px}
.fact:last-child{border-bottom:0}
.fact span{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.fact b{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;color:var(--ink)}
.fact b.hot{color:var(--brass)}
.sec{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.sec h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1;margin:0}
.sec span{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.index{margin-bottom:60px}
.irow{display:grid;grid-template-columns:76px minmax(0,1fr) 150px auto;align-items:center;gap:22px;padding:16px 8px 16px 0;border-bottom:1px solid var(--line);position:relative;transition:background .15s}
.irow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.irow:hover{background:linear-gradient(90deg,var(--brass-wash),transparent 70%)}
.irow:hover::before{background:var(--brass)}
.inum{font-family:var(--serif);font-size:44px;line-height:1;color:var(--ink-3);text-align:right;transition:color .15s}
.irow:hover .inum{color:var(--brass)}
.ititle{font-size:17px;font-weight:600;line-height:1.3;color:var(--ink)}
.ititle:hover{color:var(--brass);text-decoration:none}
.imeta{font:11px var(--mono);letter-spacing:.06em;color:var(--ink-3);margin-top:4px}
.imeta b{color:var(--ink-2);font-weight:500}
.iweight{display:flex;flex-direction:column;gap:6px}
.iweight .track{height:4px;background:var(--line);position:relative}
.iweight .track i{position:absolute;left:0;top:0;bottom:0;background:var(--brass)}
.iweight span{font:11px var(--mono);color:var(--ink-3);letter-spacing:.06em}
.ilinks{display:flex}
.ilinks a{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding:7px 11px;border:1px solid var(--line);margin-left:-1px}
.ilinks a:hover{color:var(--brass-ink);background:var(--brass);border-color:var(--brass);text-decoration:none;position:relative;z-index:1}
.best{display:inline-block;margin-left:10px;color:var(--green)}
.appx{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:60px}
.acard{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 24px 22px;display:flex;flex-direction:column;gap:8px;background:var(--surface);transition:background .15s}
.acard:hover{background:var(--surface-2);text-decoration:none}
.acard .label{color:var(--ink-3)}
.acard h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1;margin:0;color:var(--ink)}
.acard p{margin:0;color:var(--ink-2);font-size:13.5px}
.acard .go{margin-top:auto;padding-top:10px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.acard.feature{background:linear-gradient(135deg,rgba(212,166,64,.16),var(--surface) 60%);grid-column:span 2}
.acard.feature h3{font-size:34px}
.acard.feature .label{color:var(--brass)}
.outline{border:1px solid var(--line);background:var(--surface)}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 220px 48px;gap:16px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px}
.orow:last-child{border-bottom:0}
.orow a{color:var(--ink-2)}
.orow a:hover{color:var(--brass)}
.orow .track{height:6px;background:var(--line);position:relative}
.orow .track i{position:absolute;left:0;top:0;bottom:0;background:var(--brass-2)}
.orow.big .track i{background:var(--brass)}
.orow b{font:500 13px var(--mono);text-align:right;color:var(--ink)}

/* ---------- page head / tabs ---------- */
.page-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:end;margin-bottom:26px}
.page-head .big-num{font-family:var(--serif);font-size:120px;line-height:.78;color:transparent;-webkit-text-stroke:1px var(--brass);letter-spacing:-.04em}
.page-head.plain{grid-template-columns:1fr}
.crumbs{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.crumbs a{color:var(--ink-3)}
.crumbs a:hover{color:var(--brass)}
.page-head h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.2vw,50px);margin:0 0 8px;line-height:1.02;letter-spacing:-.01em}
.page-head .sub{color:var(--ink-2);font:12px var(--mono);letter-spacing:.06em}
.page-head .sub b{color:var(--brass);font-weight:500}
.tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:32px;overflow-x:auto}
.tabs a{padding:13px 20px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-right:1px solid var(--line);white-space:nowrap;position:relative}
.tabs a:hover{color:var(--ink);background:var(--surface);text-decoration:none}
.tabs a.on{color:var(--brass);background:var(--surface)}
.tabs a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brass)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:40px;align-items:start}
.toc{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto;font-size:13px}
.toc b{display:block;font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.toc a{display:block;color:var(--ink-2);padding:6px 0 6px 12px;line-height:1.35;border-left:1px solid var(--line)}
.toc a:hover{color:var(--brass);border-left-color:var(--brass);text-decoration:none}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:22px;border-top:1px solid var(--line)}

/* ---------- prose ---------- */
.prose{background:var(--surface);border:1px solid var(--line);padding:40px 46px;position:relative}
.prose::before{content:"";position:absolute;top:-1px;left:-1px;width:64px;height:3px;background:var(--brass)}
.prose h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;margin:46px 0 16px;padding-top:18px;border-top:1px solid var(--line)}
.prose h2:first-child{margin-top:0;padding-top:0;border-top:0}
.prose h3{font-size:16px;font-weight:600;margin:30px 0 10px;color:var(--ink);display:flex;align-items:center;gap:10px}
.prose h3::before{content:"";width:8px;height:8px;border:1.5px solid var(--brass);transform:rotate(45deg);flex:none}
.prose h4{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:22px 0 8px}
.prose p,.prose ul,.prose ol{margin:0 0 14px;color:var(--ink)}
.prose ul,.prose ol{padding-left:22px}
.prose ul li::marker{color:var(--brass)}
.prose ol li::marker{color:var(--brass);font-family:var(--mono);font-size:.85em}
.prose li{margin:4px 0}
.prose hr{border:0;border-top:1px dashed var(--line-2);margin:32px 0}
.prose hr + h2{border-top:0;padding-top:0;margin-top:0}
.prose strong{font-weight:600;color:#fff8e6}
.prose em{color:var(--ink-2)}
.prose a{border-bottom:1px solid rgba(212,166,64,.4)}
.prose a:hover{text-decoration:none;border-bottom-color:var(--brass)}
.prose .tbl{overflow-x:auto;margin:10px 0 22px;border:1px solid var(--line-2)}
.prose table{width:100%;border-collapse:collapse;font-size:14px}
.prose tr > :last-child{border-right:0}.prose tbody tr:last-child td{border-bottom:0}
.prose th,.prose td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.prose thead th{background:var(--bg-2);font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.prose tbody tr:hover{background:var(--brass-wash)}
.prose blockquote{margin:0 0 14px;padding:10px 16px;border-left:2px solid var(--line-2);color:var(--ink-2)}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--bg-2);padding:1px 5px;border:1px solid var(--line)}
.callout{border:1px solid var(--line);border-left:3px solid var(--ink-3);padding:14px 18px;margin:0 0 18px;background:var(--bg-2)}
.callout .ct{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;color:var(--ink-2)}
.callout .cb > :last-child{margin-bottom:0}
.callout .cb p{margin:0 0 8px}
.callout.c-tip{border-left-color:var(--green);background:var(--green-wash)} .callout.c-tip .ct{color:var(--green)}
.callout.c-important,.callout.c-success{border-left-color:var(--brass);background:var(--brass-wash)} .callout.c-important .ct,.callout.c-success .ct{color:var(--brass)}
.callout.c-warning,.callout.c-caution{border-left-color:var(--amber);background:var(--amber-wash)} .callout.c-warning .ct{color:var(--amber)}
.callout.c-info,.callout.c-note,.callout.c-abstract{border-left-color:var(--teal);background:var(--teal-wash)} .callout.c-info .ct,.callout.c-note .ct{color:var(--teal)}
.callout.c-summary{border-left-color:var(--plum);background:var(--plum-wash)} .callout.c-summary .ct{color:var(--plum)}
.callout.c-failure,.callout.c-danger{border-left-color:var(--blood);background:var(--blood-wash)}
details.callout{padding:0;background:var(--bg-2)}
details.callout > summary{list-style:none;cursor:pointer;padding:13px 18px;font-weight:600;font-size:15px;display:flex;gap:12px;align-items:baseline}
details.callout > summary::-webkit-details-marker{display:none}
details.callout > summary::before{content:"+";font:600 14px var(--mono);color:var(--brass);width:14px;flex:none}
details.callout[open] > summary::before{content:"\2212"}
details.callout[open] > summary{border-bottom:1px dashed var(--line-2)}
details.callout .cb{padding:12px 18px 14px 44px;color:var(--ink-2)}
details.callout.c-question{border-left-color:var(--brass)}
details.callout.c-question:hover{background:var(--surface-2)}

/* ---------- panels / quiz ---------- */
.panel{background:var(--surface);border:1px solid var(--line);padding:30px;max-width:880px;position:relative}
.panel::before{content:"";position:absolute;top:-1px;left:-1px;width:64px;height:3px;background:var(--brass)}
.panel h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;margin:0 0 10px}
.panel h3{font-family:var(--serif);font-weight:400;font-size:24px}
.panel .muted,.muted{color:var(--ink-2);font-size:14px}
.opts-row{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{border:0;background:transparent;padding:9px 16px;font:500 12px var(--mono);letter-spacing:.08em;color:var(--ink-2);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button.on{background:var(--brass);color:var(--brass-ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.qtopic{display:inline-block;font:500 11px var(--mono);letter-spacing:.08em;color:var(--teal);border:1px solid rgba(62,154,163,.35);padding:3px 9px;margin-bottom:14px}
.qtext{font-family:var(--serif);font-size:27px;line-height:1.25;margin:0 0 24px;font-weight:400;color:var(--ink)}
.choices{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.choice{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start;text-align:left;width:100%;padding:15px 14px 15px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-size:15.5px;line-height:1.5;position:relative;transition:background .12s}
.choice::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
.choice:hover:not(:disabled){background:var(--brass-wash)}
.choice:hover:not(:disabled)::before{background:var(--brass)}
.choice .k{font:600 13px var(--mono);color:var(--ink-3);border:1px solid var(--line-2);height:28px;display:flex;align-items:center;justify-content:center;margin-left:10px}
.choice.sel{background:var(--brass-wash)} .choice.sel::before{background:var(--brass)}
.choice.sel .k{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.choice.right{background:var(--green-wash)} .choice.right::before{background:var(--green)}
.choice.right .k{background:var(--green);border-color:var(--green);color:#06140c}
.choice.wrong{background:var(--blood-wash)} .choice.wrong::before{background:var(--blood)}
.choice.wrong .k{background:var(--blood);border-color:var(--blood);color:#1a0604}
.choice:disabled{cursor:default}
.expl{margin-top:20px;padding:16px 18px;font-size:15px;border:1px solid var(--line);border-left:3px solid}
.expl.ok{border-left-color:var(--green);background:var(--green-wash)}
.expl.no{border-left-color:var(--blood);background:var(--blood-wash)}
.expl b{display:block;margin-bottom:6px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.expl.ok b{color:var(--green)} .expl.no b{color:var(--blood)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.progress{height:2px;background:var(--line);margin:-30px -30px 26px;position:relative}
.progress > i{display:block;height:100%;background:var(--brass);transition:width .25s}
.stamp{display:inline-block;font:700 15px var(--mono);letter-spacing:.3em;text-transform:uppercase;padding:6px 12px 6px 16px;border:2px solid;transform:rotate(-4deg);margin:6px 0 0}
.stamp.pass{color:var(--green);border-color:var(--green)} .stamp.fail{color:var(--blood);border-color:var(--blood)}
.score-row{display:flex;align-items:center;gap:24px;margin:10px 0 6px}
.score-big{font-family:var(--serif);font-size:96px;line-height:.9;letter-spacing:-.03em}
.pass{color:var(--green)} .fail{color:var(--blood)}
.review-item{border-top:1px solid var(--line);padding:18px 0}
.review-item .q{font-weight:600;margin-bottom:10px}
.review-item .a{font-size:14px;color:var(--ink-2)}
.review-item .a div{margin:3px 0}
.tag-ok{color:var(--green);font-weight:600}.tag-no{color:var(--blood);font-weight:600}
.breakdown{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
.breakdown th{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px;border-bottom:1px solid var(--line-2)}
.breakdown td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.breakdown td:nth-child(n+2),.breakdown th:nth-child(n+2){text-align:right;font-family:var(--mono)}
.kbd{font:11px var(--mono);border:1px solid var(--line-2);padding:1px 6px;color:var(--ink-2)}
.hint{font:11px var(--mono);color:var(--ink-3);letter-spacing:.06em;margin-right:12px}

/* ---------- exam ---------- */
.exam-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
.exam-side{position:sticky;top:84px;padding:22px!important}
.timer{font:600 34px var(--mono);letter-spacing:.02em;margin:4px 0 14px;color:var(--ink)}
.timer.low{color:var(--blood)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:3px;max-height:44vh;overflow-y:auto;overflow-x:hidden;padding:1px}
.qgrid button{border:1px solid var(--line);background:var(--bg-2);font:11px var(--mono);padding:6px 0;color:var(--ink-3)}
.qgrid button:hover{border-color:var(--brass);color:var(--ink)}
.qgrid button.ans{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
.qgrid button.flag{box-shadow:inset 0 -3px 0 var(--amber)}
.qgrid button.cur{border-color:var(--brass);color:var(--brass)}
.legend{display:flex;gap:14px;font:11px var(--mono);color:var(--ink-3);margin:12px 0;letter-spacing:.04em}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--bg-2);border:1px solid var(--line-2)}
.legend .l-a::before{background:var(--surface-2)}
.legend .l-f::before{box-shadow:inset 0 -3px 0 var(--amber)}
.flagbtn.on{border-color:var(--amber);color:var(--amber);background:var(--amber-wash)}

@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}.exam-wrap{grid-template-columns:minmax(0,1fr)}.exam-side{position:static}
  .hero{grid-template-columns:minmax(0,1fr)}.hero-l{border-right:0;border-bottom:1px solid var(--line)}.irow{grid-template-columns:56px minmax(0,1fr) auto}.iweight{display:none}.acard.feature{grid-column:auto}}
@media (max-width:640px){
  .top-in{flex-wrap:wrap;height:auto;padding:10px 14px 0;gap:6px}.brand small{display:none}
  nav.main{margin-left:0;width:calc(100% + 28px);margin:0 -14px;border-top:1px solid var(--line);overflow-x:auto}nav.main a{padding:11px 14px;white-space:nowrap;flex:1;justify-content:center}nav.main a:first-child{border-left:0}
  main{padding:26px 14px 70px}.hero-l{padding:28px 22px}.fact{padding:13px 22px}.fact b{font-size:24px}
  .irow{grid-template-columns:44px minmax(0,1fr);gap:14px}.inum{font-size:32px}.ilinks{grid-column:2;flex-wrap:wrap}
  .page-head{grid-template-columns:1fr}.page-head .big-num{font-size:72px}
  .prose{padding:24px 18px}.prose h2{font-size:26px}.panel{padding:22px 18px}.progress{margin:-22px -18px 20px}.qtext{font-size:22px}.score-big{font-size:68px}
  .orow{grid-template-columns:minmax(0,1fr) 40px}.orow .track{display:none}}
</style>
</head>

<script>
(function(){
"use strict";
const LS = (()=>{try{const k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return localStorage}catch(e){return null}})();
const SS = (()=>{try{const k="__t";sessionStorage.setItem(k,"1");sessionStorage.removeItem(k);return sessionStorage}catch(e){return null}})();
const PFX = "waexam-shared-";
const store = {
  get(k,d){try{const v=LS&&LS.getItem(PFX+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{LS&&LS.setItem(PFX+k,JSON.stringify(v))}catch(e){}}
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const P = JSON.parse(document.getElementById("payload").textContent);
let DATA = null;

async function decrypt(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

async function unlock(pass, remember){
  const btn = document.getElementById("unlockBtn"), err = document.getElementById("gateErr");
  btn.disabled = true; btn.textContent = "Unlocking..."; err.textContent = "";
  try{
    DATA = await decrypt(pass);
    try{ SS && SS.setItem(PFX+"pass", pass); if(remember && LS) LS.setItem(PFX+"pass", pass); }catch(e){}
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    init();
  }catch(e){
    err.textContent = "That passcode didn't work. Try again.";
    btn.disabled = false; btn.textContent = "Unlock";
  }
}
document.getElementById("gateForm").addEventListener("submit", e => {
  e.preventDefault();
  unlock(document.getElementById("pass").value, document.getElementById("remember").checked);
});
document.getElementById("lockBtn").addEventListener("click", e => {
  e.preventDefault();
  try{ SS && SS.removeItem(PFX+"pass"); LS && LS.removeItem(PFX+"pass"); }catch(e){}
  location.hash = ""; location.reload();
});
(function auto(){
  let p = null; try{ p = (SS && SS.getItem(PFX+"pass")) || (LS && LS.getItem(PFX+"pass")); }catch(e){}
  if(p) unlock(p, !!(LS && LS.getItem(PFX+"pass")));
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = i => "ABCD"[i];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function prepQ(q){ // shuffle options, keep track of answer
  const order = shuffle([0,1,2,3].slice(0,q.options.length));
  return {...q, options: order.map(i=>q.options[i]), answer: order.indexOf(q.answer)};
}
function fixedQ(q){ return {...q}; }
const view = () => $("#view");
let cleanup = null;
function setNav(k){ document.querySelectorAll("#nav a[data-k]").forEach(a=>a.classList.toggle("on", a.dataset.k===k)); }
function chapter(n){ return DATA.chapters.find(c=>c.n===n); }
function bestKey(id){ return "best-"+id; }

/* ---------- router ---------- */
function init(){
  document.title = DATA.meta.title;
  $("#foot").innerHTML = esc(DATA.meta.footer || "");
  window.addEventListener("hashchange", route);
  route();
}
function route(){
  if(cleanup){ try{cleanup()}catch(e){} cleanup = null; }
  const h = (location.hash || "#/").slice(1).split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(h[0]==="ch" && h[1]) return renderChapter(parseInt(h[1],10), h[2]||"notes");
  if(h[0]==="exam") return renderExamHub(h[1]);
  if(h[0]==="review") return h[1] ? renderResource(h[1]) : renderReview();
  return renderHome();
}

/* ---------- home ---------- */
function renderHome(){
  setNav("home");
  const m = DATA.meta, pad = n => String(n).padStart(2,"0");
  const maxW = Math.max(...DATA.chapters.map(c=>c.weight));
  const totalQ = DATA.chapters.reduce((a,c)=>a+c.quiz.length,0);
  let html = `<section class="hero rise"><div class="hero-l"><span class="label">Washington &middot; Life &amp; Disability Producer</span>
    <h1>Life &amp; Health<br><em>Exam Prep</em></h1><p>${esc(m.intro)}</p></div>
    <div class="hero-r">${m.facts.map(f=>`<div class="fact"><span>${esc(f[0])}</span><b class="${f[2]||""}">${esc(f[1])}</b></div>`).join("")}</div></section>`;
  html += `<section class="index"><div class="sec"><h2>The chapters</h2><span>${DATA.chapters.length} chapters &middot; ${totalQ} practice questions</span></div>`;
  DATA.chapters.forEach((c,i)=>{
    const best = store.get(bestKey("ch"+c.n), null);
    html += `<div class="irow rise" style="animation-delay:${80+i*35}ms"><div class="inum">${pad(c.n)}</div>
      <div><a class="ititle" href="#/ch/${c.n}/notes">${esc(c.title)}</a><div class="imeta"><b>${c.quiz.length}</b> questions${best!=null?`<span class="best">best ${best}%</span>`:""}</div></div>
      <div class="iweight"><div class="track"><i style="width:${c.weight/maxW*100}%"></i></div><span>${c.weight}% of exam</span></div>
      <div class="ilinks">${c.has.notes?`<a href="#/ch/${c.n}/notes">Notes</a>`:""}${c.has.guide?`<a href="#/ch/${c.n}/guide">Guide</a>`:""}${c.has.summary?`<a href="#/ch/${c.n}/summary">Summary</a>`:""}<a href="#/ch/${c.n}/quiz">Quiz</a></div></div>`;
  });
  html += `</section><div class="sec"><h2>Appendix</h2><span>Practice exams and review</span></div><div class="appx">`;
  DATA.exams.forEach((ex,i)=>{ html += `<a class="acard ${i===0?"feature":""}" href="#/exam/${ex.id}"><span class="label">Practice exam</span><h3>${esc(ex.title)}</h3><p>${esc(ex.blurb)}</p><span class="go">Begin &rarr;</span></a>`; });
  for(const r of DATA.resources) html += `<a class="acard" href="#/review/${r.id}"><span class="label">Review</span><h3>${esc(r.title)}</h3><p>${esc(r.blurb)}</p><span class="go">Open &rarr;</span></a>`;
  html += `<a class="acard" href="#/review/bank"><span class="label">Practice</span><h3>Question bank</h3><p>Mixed practice from every chapter with instant feedback.</p><span class="go">Start &rarr;</span></a></div>`;
  const maxO = Math.max(...m.outline.map(o=>o.w));
  html += `<div class="sec"><h2>Content outline</h2><span>Share of the 150 scored questions</span></div><div class="outline">${m.outline.map(o=>`<div class="orow ${o.w>=20?"big":""}"><div>${o.ch?`<a href="#/ch/${o.ch}/notes">${esc(o.topic)}</a>`:esc(o.topic)}</div><div class="track"><i style="width:${o.w/maxO*100}%"></i></div><b>${o.w}%</b></div>`).join("")}</div>`;
  view().innerHTML = html;
}

/* ---------- chapter ---------- */
const TABS = [["notes","Notes"],["guide","Study guide"],["summary","Summary"],["quiz","Quiz"]];
function renderChapter(n, tab){
  setNav("home");
  const c = chapter(n); if(!c) return renderHome();
  if(tab!=="quiz" && !c.has[tab]) tab = "notes";
  const idx = DATA.chapters.indexOf(c), prev = DATA.chapters[idx-1], next = DATA.chapters[idx+1];
  let html = `<div class="page-head rise"><div class="big-num">${String(c.n).padStart(2,"0")}</div><div><div class="crumbs"><a href="#/">Chapters</a> / Chapter ${c.n} of ${DATA.chapters.length}</div><h1>${esc(c.title)}</h1><div class="sub"><b>${c.weight}%</b> of the exam &middot; ${c.quiz.length} practice questions</div></div></div>`;
  html += `<div class="tabs">${TABS.filter(([k])=>k==="quiz"||c.has[k]).map(([k,l])=>`<a href="#/ch/${c.n}/${k}" class="${k===tab?"on":""}">${l}</a>`).join("")}</div>`;
  if(tab==="quiz"){
    html += `<div id="quizHost"></div>`;
  } else {
    const body = DATA.docs[c.docs[tab]];
    html += `<div class="layout"><article class="prose" id="doc">${body}</article><aside class="toc" id="toc"></aside></div>`;
  }
  html += `<div class="pager">${prev?`<a class="btn" href="#/ch/${prev.n}/${tab==="quiz"?"quiz":"notes"}">&larr; Chapter ${prev.n}</a>`:"<span></span>"}${next?`<a class="btn" href="#/ch/${next.n}/${tab==="quiz"?"quiz":"notes"}">Chapter ${next.n} &rarr;</a>`:`<a class="btn primary" href="#/exam">Practice exam &rarr;</a>`}</div>`;
  view().innerHTML = html;
  if(tab==="quiz") Quiz.mount($("#quizHost"), {id:"ch"+c.n, title:`Chapter ${c.n} quiz`, pool:c.quiz, fixed:false});
  else buildToc();
}
function buildToc(){
  const doc = $("#doc"), toc = $("#toc"); if(!doc||!toc) return;
  doc.querySelectorAll("table").forEach(tb=>{ if(tb.parentElement.classList.contains("tbl")) return; const w=document.createElement("div"); w.className="tbl"; tb.before(w); w.append(tb); });
  const hs = [...doc.querySelectorAll("h2")];
  if(hs.length<2){ toc.innerHTML=""; return; }
  hs.forEach((h,i)=>{ if(!h.id) h.id = "s"+i; });
  toc.innerHTML = `<b>On this page</b>` + hs.map(h=>`<a href="javascript:void(0)" data-id="${h.id}">${esc(h.textContent)}</a>`).join("");
  toc.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{const t=document.getElementById(a.dataset.id); if(t) window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-80,behavior:"smooth"});}));
}

/* ---------- review / resources ---------- */
function renderReview(){
  setNav("review");
  let html = `<div class="page-head plain rise"><div><div class="crumbs">Appendix</div><h1>Review</h1><div class="sub">Cross-chapter review material and exam logistics.</div></div></div><div class="appx">`;
  for(const r of DATA.resources) html += `<a class="acard" href="#/review/${r.id}"><span class="label">Review</span><h3>${esc(r.title)}</h3><p>${esc(r.blurb)}</p><span class="go">Open &rarr;</span></a>`;
  html += `<a class="acard" href="#/review/bank"><span class="label">Practice</span><h3>Question bank</h3><p>Mixed practice from every chapter with instant feedback.</p><span class="go">Start &rarr;</span></a>`;
  html += `</div>`;
  view().innerHTML = html;
}
function renderResource(id){
  setNav("review");
  if(id==="bank"){
    const pool = DATA.chapters.flatMap(c=>c.quiz.map(q=>({...q, ch:c.n})));
    view().innerHTML = `<div class="page-head plain"><div><div class="crumbs"><a href="#/review">Review</a> / Question bank</div><h1>Question bank</h1><div class="sub">${pool.length} questions across all chapters</div></div></div><div id="quizHost"></div>`;
    Quiz.mount($("#quizHost"), {id:"bank", title:"Mixed practice", pool, fixed:false, showCh:true});
    return;
  }
  const r = DATA.resources.find(x=>x.id===id); if(!r) return renderReview();
  view().innerHTML = `<div class="page-head plain"><div><div class="crumbs"><a href="#/review">Review</a> / ${esc(r.title)}</div><h1>${esc(r.title)}</h1><div class="sub">${esc(r.blurb)}</div></div></div><div class="layout"><article class="prose" id="doc">${DATA.docs[r.doc]}</article><aside class="toc" id="toc"></aside></div>`;
  buildToc();
}

/* ---------- quiz (instant feedback) ---------- */
const Quiz = {
  mount(host, cfg){
    const st = {cfg, qs:[], i:0, picks:[], phase:"setup", count: cfg.defaultCount || Math.min(20, cfg.pool.length)};
    const draw = () => {
      if(st.phase==="setup") return setup();
      if(st.phase==="q") return question();
      return results();
    };
    function setup(){
      const n = cfg.pool.length;
      const sizes = [10,20,n].filter((v,i,a)=>v<=n && a.indexOf(v)===i);
      const best = store.get(bestKey(cfg.id), null);
      host.innerHTML = `<div class="panel"><h2>${esc(cfg.title)}</h2><div class="muted">${n} questions in this set. Questions and answer choices are shuffled each time, and you see the answer and explanation after every question.${best!=null?` Your best score on this device: <b>${best}%</b>.`:""}</div>
      ${cfg.fixed?"":`<div class="opts-row"><div class="seg" id="seg">${sizes.map(s=>`<button data-n="${s}" class="${s===st.count?"on":""}">${s===n?`All ${n}`:s}</button>`).join("")}</div></div>`}
      <button class="btn primary" id="go" style="margin-top:${cfg.fixed?16:0}px">Start</button></div>`;
      host.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{st.count=+b.dataset.n; setup();});
      host.querySelector("#go").onclick=()=>{
        st.qs = cfg.fixed ? cfg.pool.map(fixedQ) : shuffle(cfg.pool).slice(0,st.count).map(prepQ);
        st.i=0; st.picks=new Array(st.qs.length).fill(null); st.phase="q"; draw();
      };
    }
    function question(){
      const q = st.qs[st.i], pick = st.picks[st.i], done = pick!==null;
      const correct = st.picks.filter((p,j)=>p!==null && p===st.qs[j].answer).length, answered = st.picks.filter(p=>p!==null).length;
      host.innerHTML = `<div class="panel">
        <div class="progress"><i style="width:${(st.i)/st.qs.length*100}%"></i></div>
        <div class="qhead"><span>Question ${st.i+1} of ${st.qs.length}${cfg.showCh&&q.ch?` &middot; Chapter ${q.ch}`:""}</span><span>${answered?`${correct}/${answered} correct`:""}</span></div>
        ${q.topic?`<span class="qtopic">${esc(q.topic)}</span>`:""}
        <p class="qtext">${esc(q.q)}</p>
        <div class="choices">${q.options.map((o,j)=>{
          let cls = ""; if(done){ if(j===q.answer) cls="right"; else if(j===pick) cls="wrong"; }
          return `<button class="choice ${cls}" data-j="${j}" ${done?"disabled":""}><span class="k">${L(j)}</span><span>${esc(o)}</span></button>`;}).join("")}</div>
        ${done?`<div class="expl ${pick===q.answer?"ok":"no"}"><b>${pick===q.answer?"Correct.":"Not quite. The answer is "+L(q.answer)+"."}</b>${esc(q.explanation||"")}</div>`:""}
        <div class="qnav"><button class="btn" id="quit">End quiz</button><span><span class="hint">${done?'<span class="kbd">Enter</span> next':'<span class="kbd">A</span>-<span class="kbd">D</span> to answer'}</span><button class="btn primary" id="next" ${done?"":"disabled"}>${st.i===st.qs.length-1?"See results":"Next"}</button></span></div>
      </div>`;
      host.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ if(st.picks[st.i]!==null) return; st.picks[st.i]=+b.dataset.j; question(); });
      host.querySelector("#next").onclick=()=>{ if(st.i<st.qs.length-1){st.i++; question(); window.scrollTo(0,host.offsetTop-90);} else {st.phase="done"; draw();} };
      host.querySelector("#quit").onclick=()=>{ st.phase="done"; draw(); };
    }
    function results(){
      const answered = st.qs.map((q,j)=>({q, p:st.picks[j]})).filter(x=>x.p!==null);
      const right = answered.filter(x=>x.p===x.q.answer).length;
      const pct = answered.length ? Math.round(right/answered.length*100) : 0;
      if(answered.length >= Math.min(10, st.qs.length) && !cfg.noBest){ const b = store.get(bestKey(cfg.id), null); if(b==null || pct>b) store.set(bestKey(cfg.id), pct); }
      const missed = answered.filter(x=>x.p!==x.q.answer);
      host.innerHTML = `<div class="panel"><span class="label">Quiz results</span>
        <div class="score-row"><div class="score-big ${pct>=70?"pass":"fail"}">${pct}%</div><span class="stamp ${pct>=70?"pass":"fail"}">${pct>=70?"Pass":"Below 70"}</span></div>
        <div class="muted">${right} of ${answered.length} answered correctly${answered.length<st.qs.length?` (${st.qs.length-answered.length} not answered)`:""}. The state exam passing score is 70%.</div>
        <div class="opts-row">${missed.length?`<button class="btn primary" id="retryMissed">Retry the ${missed.length} missed</button>`:""}<button class="btn" id="again">New quiz</button></div>
        ${missed.length?`<div class="sec" style="margin-top:28px"><h2 style="font-size:26px">Missed questions</h2><span>${missed.length} to review</span></div>`+missed.map(x=>reviewItem(x.q,x.p)).join(""):`<p class="muted">No misses. Nice work.</p>`}
      </div>`;
      const rm = host.querySelector("#retryMissed");
      if(rm) rm.onclick=()=>{ st.qs = shuffle(missed.map(x=>x.q)).map(q=>cfg.fixed?q:prepQ(q)); st.i=0; st.picks=new Array(st.qs.length).fill(null); st.phase="q"; draw(); };
      host.querySelector("#again").onclick=()=>{ st.phase="setup"; draw(); };
    }
    const onKey = e => {
      if(st.phase!=="q" || e.target.tagName==="INPUT") return;
      const k = e.key.toUpperCase();
      if("ABCD".includes(k) && k.length===1){ const b = host.querySelector(`.choice[data-j="${"ABCD".indexOf(k)}"]`); if(b && !b.disabled) b.click(); }
      if(e.key==="Enter"){ const n = host.querySelector("#next"); if(n && !n.disabled){ e.preventDefault(); n.click(); } }
    };
    document.addEventListener("keydown", onKey);
    cleanup = () => document.removeEventListener("keydown", onKey);
    draw();
  }
};
function reviewItem(q, p){
  return `<div class="review-item"><div class="q">${esc(q.q)}</div><div class="a">
    ${p===null?`<div class="tag-no">Not answered</div>`:p===q.answer?`<div class="tag-ok">Your answer: ${L(p)}. ${esc(q.options[p])}</div>`:`<div class="tag-no">Your answer: ${L(p)}. ${esc(q.options[p])}</div>`}
    ${p!==q.answer?`<div class="tag-ok">Correct: ${L(q.answer)}. ${esc(q.options[q.answer])}</div>`:""}
    <div style="margin-top:6px">${esc(q.explanation||"")}</div></div></div>`;
}

/* ---------- practice exam ---------- */
function buildExam(ex){
  if(ex.fixed) return ex.questions.map(fixedQ);
  const out = [], rest = [];
  let target = 0;
  for(const [n, k] of Object.entries(ex.blueprint)){
    target += k;
    const c = chapter(+n); if(!c) continue;
    const s = shuffle(c.quiz);
    s.slice(0, k).forEach(q=>out.push(prepQ({...q, ch:+n})));
    s.slice(k).forEach(q=>rest.push({...q, ch:+n}));
  }
  shuffle(rest).slice(0, Math.max(0, target-out.length)).forEach(q=>out.push(prepQ(q)));
  return shuffle(out);
}
function renderExamHub(id){
  setNav("exam");
  if(id){ const ex = DATA.exams.find(e=>e.id===id); if(ex) return Exam.start(ex); }
  if(DATA.exams.length===1) return Exam.start(DATA.exams[0]);
  let html = `<div class="page-head plain rise"><div><div class="crumbs">Appendix</div><h1>Practice exams</h1><div class="sub">Full-length practice in exam conditions or study mode.</div></div></div><div class="appx">`;
  DATA.exams.forEach((ex,i)=>{ html += `<a class="acard ${i===0?"feature":""}" href="#/exam/${ex.id}"><span class="label">Practice exam</span><h3>${esc(ex.title)}</h3><p>${esc(ex.blurb)}</p><span class="go">Begin &rarr;</span></a>`; });
  view().innerHTML = html + `</div>`;
}
const Exam = {
  start(ex){
    const host = view();
    const st = {ex, mode:"timed", qs:[], picks:[], flags:[], i:0, end:0, timer:null, phase:"setup"};
    const fmt = s => { s=Math.max(0,s|0); const h=s/3600|0, m=(s%3600)/60|0, x=s%60; return `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`; };
    function setup(){
      const n = ex.fixed ? ex.questions.length : Object.values(ex.blueprint).reduce((a,b)=>a+b,0);
      host.innerHTML = `<div class="page-head plain"><div><div class="crumbs"><a href="#/exam">Practice exams</a></div><h1>${esc(ex.title)}</h1><div class="sub">${esc(ex.blurb)}</div></div></div>
      <div class="panel"><h2>Choose a mode</h2><div class="muted">${n} questions${ex.fixed?"":", drawn fresh each attempt and weighted like the state exam content outline"}. Passing score: 70%.</div>
      <div class="opts-row"><div class="seg" id="mode"><button data-m="timed" class="${st.mode==="timed"?"on":""}">Exam mode (${fmt(ex.minutes*60)})</button><button data-m="study" class="${st.mode==="study"?"on":""}">Study mode</button></div></div>
      <div class="muted" style="margin-bottom:16px">${st.mode==="timed"?"Timed, like the real test. No feedback until you submit. Flag questions to come back to them.":"Untimed. See the answer and explanation after each question."}</div>
      <button class="btn primary" id="go">Start</button></div>`;
      host.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m; setup();});
      host.querySelector("#go").onclick=()=>{
        st.qs = buildExam(ex);
        if(st.mode==="study"){ host.innerHTML = `<div class="page-head plain"><div><div class="crumbs"><a href="#/exam">Practice exams</a></div><h1>${esc(ex.title)}</h1><div class="sub">Study mode</div></div></div><div id="quizHost"></div>`;
          return Quiz.mount($("#quizHost"), {id:"exam-"+ex.id, title:ex.title+" (study mode)", pool:st.qs, fixed:true, showCh:true, noBest:true});
        }
        st.picks = new Array(st.qs.length).fill(null); st.flags = new Array(st.qs.length).fill(false); st.i=0; st.phase="q";
        st.end = Date.now() + ex.minutes*60*1000;
        st.timer = setInterval(tick, 1000);
        cleanup = () => { clearInterval(st.timer); document.removeEventListener("keydown", onKey); window.onbeforeunload = null; };
        document.addEventListener("keydown", onKey);
        window.onbeforeunload = () => "Your exam is in progress.";
        draw();
      };
    }
    function tick(){ const left = (st.end-Date.now())/1000; const t = $("#timer"); if(t){ t.textContent = fmt(left); t.classList.toggle("low", left<600); } if(left<=0){ submit(true); } }
    function draw(){
      const q = st.qs[st.i], pick = st.picks[st.i];
      const answered = st.picks.filter(p=>p!==null).length;
      host.innerHTML = `<div class="exam-wrap"><div class="panel" style="max-width:none">
        <div class="progress"><i style="width:${answered/st.qs.length*100}%"></i></div>
        <div class="qhead"><span>Question ${st.i+1} of ${st.qs.length}</span><button class="btn sm flagbtn ${st.flags[st.i]?"on":""}" id="flag">${st.flags[st.i]?"Flagged":"Flag for review"}</button></div>
        <p class="qtext">${esc(q.q)}</p>
        <div class="choices">${q.options.map((o,j)=>`<button class="choice ${pick===j?"sel":""}" data-j="${j}"><span class="k">${L(j)}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div class="qnav"><button class="btn" id="prev" ${st.i===0?"disabled":""}>&larr; Previous</button><button class="btn primary" id="next">${st.i===st.qs.length-1?"Review and submit":"Next &rarr;"}</button></div>
      </div>
      <aside class="exam-side panel" style="padding:18px"><div class="label">Time remaining</div><div class="timer" id="timer">${fmt((st.end-Date.now())/1000)}</div>
        <div class="muted">${answered} of ${st.qs.length} answered</div>
        <div class="legend"><span class="l-a">Answered</span><span class="l-f">Flagged</span></div>
        <div class="qgrid">${st.qs.map((_,j)=>`<button data-j="${j}" class="${st.picks[j]!==null?"ans":""} ${st.flags[j]?"flag":""} ${j===st.i?"cur":""}">${j+1}</button>`).join("")}</div>
        <button class="btn primary block" id="submit" style="margin-top:14px">Submit exam</button>
      </aside></div>`;
      host.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ st.picks[st.i]=+b.dataset.j; draw(); });
      host.querySelectorAll(".qgrid button").forEach(b=>b.onclick=()=>{ st.i=+b.dataset.j; draw(); });
      host.querySelector("#flag").onclick=()=>{ st.flags[st.i]=!st.flags[st.i]; draw(); };
      host.querySelector("#prev").onclick=()=>{ if(st.i>0){st.i--; draw();} };
      host.querySelector("#next").onclick=()=>{ if(st.i<st.qs.length-1){st.i++; draw();} else confirmSubmit(); };
      host.querySelector("#submit").onclick=confirmSubmit;
    }
    function confirmSubmit(){
      const un = st.picks.filter(p=>p===null).length, fl = st.flags.filter(Boolean).length;
      if(un || fl){ if(!confirm(`${un?un+" unanswered":""}${un&&fl?" and ":""}${fl?fl+" flagged":""}. Submit anyway?`)) return; }
      submit(false);
    }
    function submit(timeUp){
      clearInterval(st.timer); window.onbeforeunload = null; document.removeEventListener("keydown", onKey);
      const right = st.qs.filter((q,j)=>st.picks[j]===q.answer).length, pct = Math.round(right/st.qs.length*100);
      const byCh = {};
      st.qs.forEach((q,j)=>{ const k = q.ch||"Mixed"; byCh[k] = byCh[k]||{t:0,r:0}; byCh[k].t++; if(st.picks[j]===q.answer) byCh[k].r++; });
      const rows = Object.entries(byCh).sort((a,b)=>(+a[0])-(+b[0])).map(([k,v])=>{ const c = chapter(+k); return `<tr><td>${c?`Ch ${c.n}. ${esc(c.title)}`:esc(k)}</td><td>${v.r}/${v.t}</td><td>${Math.round(v.r/v.t*100)}%</td></tr>`; }).join("");
      const missed = st.qs.map((q,j)=>({q,p:st.picks[j]})).filter(x=>x.p!==x.q.answer);
      host.innerHTML = `<div class="panel" style="max-width:none"><span class="label">${timeUp?"Time is up":"Exam submitted"}</span>
        <div class="score-row"><div class="score-big ${pct>=70?"pass":"fail"}">${pct}%</div><span class="stamp ${pct>=70?"pass":"fail"}">${pct>=70?"Pass":"Below 70"}</span></div>
        <div class="muted">${right} of ${st.qs.length} correct. ${pct>=70?"That's a passing score (70% or higher).":"Below the 70% passing score."}</div>
        ${Object.keys(byCh).length>1?`<div class="sec" style="margin-top:28px"><h2 style="font-size:26px">By chapter</h2><span>Where the points went</span></div><table class="breakdown"><tr><th>Chapter</th><th>Correct</th><th>Score</th></tr>${rows}</table>`:""}
        <div class="opts-row"><button class="btn primary" id="again">Take another</button>${missed.length?`<button class="btn" id="practiceMissed">Practice the ${missed.length} missed</button>`:""}</div>
        ${missed.length?`<div class="sec" style="margin-top:28px"><h2 style="font-size:26px">Missed questions</h2><span>${missed.length} to review</span></div>`+missed.map(x=>reviewItem(x.q,x.p)).join(""):""}
      </div>`;
      host.querySelector("#again").onclick=()=>{ st.phase="setup"; setup(); };
      const pm = host.querySelector("#practiceMissed");
      if(pm) pm.onclick=()=>{ host.innerHTML = `<div id="quizHost"></div>`; Quiz.mount($("#quizHost"), {id:"exam-missed", title:"Missed questions", pool:missed.map(x=>x.q), fixed:true, showCh:true, noBest:true}); };
      window.scrollTo(0,0);
    }
    const onKey = e => {
      if(st.phase!=="q") return;
      const k = e.key.toUpperCase();
      if(k.length===1 && "ABCD".includes(k)){ st.picks[st.i]="ABCD".indexOf(k); draw(); }
      else if(e.key==="ArrowRight" && st.i<st.qs.length-1){ st.i++; draw(); }
      else if(e.key==="ArrowLeft" && st.i>0){ st.i--; draw(); }
    };
    setup();
  }
};
})();
</script>
