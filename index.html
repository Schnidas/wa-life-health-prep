<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Washington Life & Health Exam Prep</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --ink:#16202c; --ink-2:#4a5565; --ink-3:#7a8494;
  --line:#e2e6ec; --accent:#1f6f5c; --accent-2:#e7f3ef; --accent-ink:#ffffff;
  --good:#1f7a4d; --good-bg:#e8f5ee; --bad:#b4372f; --bad-bg:#fbeceb; --warn:#9a6a00; --warn-bg:#fdf5e1;
  --info:#285fa8; --info-bg:#eaf1fb; --violet:#6a43a8; --violet-bg:#f2edfa;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141a; --surface:#161d25; --surface-2:#1c252f; --ink:#e6eaf0; --ink-2:#b2bcc9; --ink-3:#808b9a;
  --line:#26313d; --accent:#4fb393; --accent-2:#163029; --accent-ink:#0b1512;
  --good:#5cc490; --good-bg:#14301f; --bad:#ef7d74; --bad-bg:#3a1a18; --warn:#e2b34e; --warn-bg:#33290f;
  --info:#7fb0f0; --info-bg:#15243a; --violet:#b69af0; --violet-bg:#261d3a; --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* Gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow)}
.gate-mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:18px}
.gate-card h1{font-size:20px;margin:0 0 4px}
.gate-card p{color:var(--ink-2);margin:0 0 20px;font-size:14px}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin:12px 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:14px;margin-top:12px;min-height:20px}

/* Shell */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .dot{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:13px}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:7px 12px;border-radius:8px;color:var(--ink-2);font-size:14px;font-weight:600}
nav.main a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
nav.main a.on{background:var(--accent-2);color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
footer.foot{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--ink-3);font-size:13px}

/* Home */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);margin-bottom:28px}
.hero h1{font-size:28px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
.hero p{color:var(--ink-2);margin:0 0 18px;max-width:720px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.chip b{color:var(--ink)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 14px}
.sec-title h2{font-size:18px;margin:0}
.sec-title span{color:var(--ink-3);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card .num{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.card h3{font-size:16px;margin:4px 0 10px;line-height:1.35}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:13px;margin-bottom:14px}
.card .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.card .links a{font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.card .links a:hover{background:var(--accent-2);color:var(--accent);text-decoration:none}
.card.feature{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-2),var(--surface) 70%)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:2px 0 14px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.outline{width:100%;border-collapse:collapse;font-size:14px}
.outline td{padding:8px 10px;border-bottom:1px solid var(--line)}
.outline td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.wbar{display:inline-block;height:6px;background:var(--accent);border-radius:99px;vertical-align:middle;margin-right:8px;opacity:.7}

/* Chapter page */
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:6px}
.page-head h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em;line-height:1.25}
.page-head .sub{color:var(--ink-2);font-size:14px;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs a{padding:10px 14px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink);text-decoration:none}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:32px;align-items:start}
.toc{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;font-size:13px;border-left:1px solid var(--line);padding-left:14px}
.toc b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.toc a{display:block;color:var(--ink-2);padding:4px 0;line-height:1.35}
.toc a:hover{color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.toc{display:none}}

/* Prose */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 32px;box-shadow:var(--shadow)}
@media (max-width:640px){.prose{padding:20px 16px}main{padding:20px 12px 60px}
.top-in{flex-wrap:wrap;gap:8px;padding:10px 12px}nav.main{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto}nav.main a{padding:6px 10px;white-space:nowrap}
.hero{padding:20px}.hero h1{font-size:22px}.page-head h1{font-size:21px}.panel{padding:18px}.qtext{font-size:16px}.grid{grid-template-columns:minmax(0,1fr)}}
html,body{overflow-x:hidden}
.prose h1{font-size:24px}
.prose h2{font-size:20px;margin:36px 0 12px;padding-top:8px;letter-spacing:-.01em}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:17px;margin:26px 0 10px}
.prose h4{font-size:15px;margin:20px 0 8px}
.prose p,.prose ul,.prose ol{margin:0 0 14px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:3px 0}
.prose hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.prose strong{font-weight:650}
.prose table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:14px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.prose thead th{background:var(--surface-2);font-weight:650}
.prose tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.prose blockquote{margin:0 0 14px;padding:10px 14px;border-left:3px solid var(--line);color:var(--ink-2)}
.prose code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.callout{border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:10px;padding:12px 16px;margin:0 0 16px;background:var(--surface-2)}
.callout .ct{font-weight:700;font-size:14px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.callout .cb > :last-child{margin-bottom:0}
.callout .cb p{margin:0 0 8px}
.callout.c-tip{border-left-color:var(--good);background:var(--good-bg)}
.callout.c-important,.callout.c-success{border-left-color:var(--violet);background:var(--violet-bg)}
.callout.c-warning,.callout.c-caution{border-left-color:var(--warn);background:var(--warn-bg)}
.callout.c-info,.callout.c-note,.callout.c-abstract{border-left-color:var(--info);background:var(--info-bg)}
.callout.c-summary{border-left-color:var(--accent);background:var(--accent-2)}
.callout.c-failure,.callout.c-danger{border-left-color:var(--bad);background:var(--bad-bg)}
details.callout{padding:0}
details.callout > summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:650;font-size:15px;display:flex;gap:10px}
details.callout > summary::-webkit-details-marker{display:none}
details.callout > summary::before{content:"+";font-weight:700;color:var(--accent);width:14px;flex:none}
details.callout[open] > summary::before{content:"\2212"}
details.callout .cb{padding:0 16px 12px 40px}
details.callout.c-question{border-left-color:var(--accent);background:var(--surface)}

/* Quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);max-width:820px}
.panel h2{margin:0 0 6px;font-size:20px}
.panel .muted{color:var(--ink-2);font-size:14px}
.opts-row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;color:var(--ink-3)}
.qtopic{background:var(--surface-2);border-radius:99px;padding:3px 10px}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:0 0 18px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;line-height:1.45}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-2)}
.choice .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.choice.sel{border-color:var(--accent);background:var(--accent-2)}
.choice.sel .k{background:var(--accent);color:var(--accent-ink)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.right .k{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .k{background:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.expl{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15px}
.expl.ok{background:var(--good-bg);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.expl.no{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.expl b{display:block;margin-bottom:4px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .2s}
.score-big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1;margin:8px 0}
.pass{color:var(--good)} .fail{color:var(--bad)}
.review-item{border-top:1px solid var(--line);padding:16px 0}
.review-item .q{font-weight:600;margin-bottom:8px}
.review-item .a{font-size:14px;color:var(--ink-2)}
.review-item .a div{margin:2px 0}
.tag-ok{color:var(--good);font-weight:700}.tag-no{color:var(--bad);font-weight:700}
.breakdown{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}
.breakdown td,.breakdown th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.breakdown td:nth-child(n+2),.breakdown th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}

/* Exam */
.exam-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
@media (max-width:960px){.exam-wrap{grid-template-columns:minmax(0,1fr)}.exam-side{position:static}}
.exam-side{position:sticky;top:76px}
.timer{font-family:var(--mono);font-size:22px;font-weight:700;margin:4px 0 10px}
.timer.low{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;max-height:46vh;overflow-y:auto;overflow-x:hidden;padding:2px 4px 2px 2px}
.qgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;padding:5px 0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qgrid button.ans{background:var(--accent-2);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.qgrid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.qgrid button.cur{outline:2px solid var(--accent)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-3);margin:10px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--surface-2);border:1px solid var(--line)}
.legend .l-a::before{background:var(--accent-2);border-color:var(--accent)}
.legend .l-f::before{box-shadow:inset 0 -3px 0 var(--warn)}
.flagbtn.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.banner{padding:12px 16px;border-radius:10px;background:var(--info-bg);color:var(--ink);font-size:14px;margin-bottom:16px}
.kbd{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.empty{color:var(--ink-3);font-size:14px}
</style>
</head>
<body>
<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="gate-mark">WA</div>
    <h1>Washington Life & Health Exam Prep</h1>
    <p>Enter the passcode to open the study platform.</p>
    <input class="field" id="pass" type="password" placeholder="Passcode" autofocus aria-label="Passcode">
    <label class="check"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
    <button class="btn primary block" id="unlockBtn" type="submit">Unlock</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>
<div id="app" class="hidden">
  <header class="top"><div class="top-in">
    <a class="brand" href="#/"><span class="dot">WA</span><span>WA Life & Health</span></a>
    <nav class="main" id="nav">
      <a href="#/" data-k="home">Chapters</a>
      <a href="#/exam" data-k="exam">Practice Exam</a>
      <a href="#/review" data-k="review">Review</a>
      <a href="#" id="lockBtn">Lock</a>
    </nav>
  </div></header>
  <main id="view"></main>

<script>
(function(){
"use strict";
const LS = (()=>{try{const k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return localStorage}catch(e){return null}})();
const SS = (()=>{try{const k="__t";sessionStorage.setItem(k,"1");sessionStorage.removeItem(k);return sessionStorage}catch(e){return null}})();
const PFX = "waexam-shared-";
const store = {
  get(k,d){try{const v=LS&&LS.getItem(PFX+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{LS&&LS.setItem(PFX+k,JSON.stringify(v))}catch(e){}}
};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const P = JSON.parse(document.getElementById("payload").textContent);
let DATA = null;

async function decrypt(pass){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

async function unlock(pass, remember){
  const btn = document.getElementById("unlockBtn"), err = document.getElementById("gateErr");
  btn.disabled = true; btn.textContent = "Unlocking..."; err.textContent = "";
  try{
    DATA = await decrypt(pass);
    try{ SS && SS.setItem(PFX+"pass", pass); if(remember && LS) LS.setItem(PFX+"pass", pass); }catch(e){}
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    init();
  }catch(e){
    err.textContent = "That passcode didn't work. Try again.";
    btn.disabled = false; btn.textContent = "Unlock";
  }
}
document.getElementById("gateForm").addEventListener("submit", e => {
  e.preventDefault();
  unlock(document.getElementById("pass").value, document.getElementById("remember").checked);
});
document.getElementById("lockBtn").addEventListener("click", e => {
  e.preventDefault();
  try{ SS && SS.removeItem(PFX+"pass"); LS && LS.removeItem(PFX+"pass"); }catch(e){}
  location.hash = ""; location.reload();
});
(function auto(){
  let p = null; try{ p = (SS && SS.getItem(PFX+"pass")) || (LS && LS.getItem(PFX+"pass")); }catch(e){}
  if(p) unlock(p, !!(LS && LS.getItem(PFX+"pass")));
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = i => "ABCD"[i];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function prepQ(q){ // shuffle options, keep track of answer
  const order = shuffle([0,1,2,3].slice(0,q.options.length));
  return {...q, options: order.map(i=>q.options[i]), answer: order.indexOf(q.answer)};
}
function fixedQ(q){ return {...q}; }
const view = () => $("#view");
let cleanup = null;
function setNav(k){ document.querySelectorAll("#nav a[data-k]").forEach(a=>a.classList.toggle("on", a.dataset.k===k)); }
function chapter(n){ return DATA.chapters.find(c=>c.n===n); }
function bestKey(id){ return "best-"+id; }

/* ---------- router ---------- */
function init(){
  document.title = DATA.meta.title;
  $("#foot").innerHTML = esc(DATA.meta.footer || "");
  window.addEventListener("hashchange", route);
  route();
}
function route(){
  if(cleanup){ try{cleanup()}catch(e){} cleanup = null; }
  const h = (location.hash || "#/").slice(1).split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(h[0]==="ch" && h[1]) return renderChapter(parseInt(h[1],10), h[2]||"notes");
  if(h[0]==="exam") return renderExamHub(h[1]);
  if(h[0]==="review") return h[1] ? renderResource(h[1]) : renderReview();
  return renderHome();
}

/* ---------- home ---------- */
function renderHome(){
  setNav("home");
  const m = DATA.meta;
  let html = `<section class="hero"><h1>${esc(m.title)}</h1><p>${esc(m.intro)}</p><div class="chips">${m.facts.map(f=>`<span class="chip">${f}</span>`).join("")}</div></section>`;
  html += `<div class="sec-title"><h2>Chapters</h2><span>Work through them in order</span></div><div class="grid">`;
  for(const c of DATA.chapters){
    const best = store.get(bestKey("ch"+c.n), null);
    const pct = best==null ? 0 : best;
    html += `<div class="card"><div class="num">Chapter ${c.n}</div><h3>${esc(c.title)}</h3>
      <div class="meta"><span>${c.weight}% of exam</span><span>${c.quiz.length} practice questions</span>${best!=null?`<span>Best quiz: ${best}%</span>`:""}</div>
      ${best!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}
      <div class="links">${c.has.notes?`<a href="#/ch/${c.n}/notes">Notes</a>`:""}${c.has.guide?`<a href="#/ch/${c.n}/guide">Study guide</a>`:""}${c.has.summary?`<a href="#/ch/${c.n}/summary">Summary</a>`:""}<a href="#/ch/${c.n}/quiz">Quiz</a></div></div>`;
  }
  html += `</div>`;
  html += `<div class="sec-title"><h2>Practice exams and review</h2><span></span></div><div class="grid">`;
  for(const ex of DATA.exams){
    html += `<div class="card feature"><div class="num">Practice exam</div><h3>${esc(ex.title)}</h3><div class="meta"><span>${esc(ex.blurb)}</span></div><div class="links"><a href="#/exam/${ex.id}">Start</a></div></div>`;
  }
  for(const r of DATA.resources){
    html += `<div class="card"><div class="num">Review</div><h3>${esc(r.title)}</h3><div class="meta"><span>${esc(r.blurb)}</span></div><div class="links"><a href="#/review/${r.id}">Open</a></div></div>`;
  }
  html += `</div>`;
  html += `<div class="sec-title"><h2>Exam content outline</h2><span>Share of the 150 questions</span></div><div class="panel" style="max-width:none"><table class="outline">${m.outline.map(o=>`<tr><td>${o.ch?`<a href="#/ch/${o.ch}/notes">${esc(o.topic)}</a>`:esc(o.topic)}</td><td><span class="wbar" style="width:${Math.max(4,o.w*3)}px"></span>${o.w}%</td></tr>`).join("")}</table></div>`;
  view().innerHTML = html;
}

/* ---------- chapter ---------- */
const TABS = [["notes","Notes"],["guide","Study guide"],["summary","Summary"],["quiz","Quiz"]];
function renderChapter(n, tab){
  setNav("home");
  const c = chapter(n); if(!c) return renderHome();
  if(tab!=="quiz" && !c.has[tab]) tab = "notes";
  const idx = DATA.chapters.indexOf(c), prev = DATA.chapters[idx-1], next = DATA.chapters[idx+1];
  let html = `<div class="page-head"><div class="crumbs"><a href="#/">Chapters</a> / Chapter ${c.n}</div><h1>${esc(c.title)}</h1><div class="sub">Chapter ${c.n} of ${DATA.chapters.length} &middot; ${c.weight}% of the exam</div></div>`;
  html += `<div class="tabs">${TABS.filter(([k])=>k==="quiz"||c.has[k]).map(([k,l])=>`<a href="#/ch/${c.n}/${k}" class="${k===tab?"on":""}">${l}</a>`).join("")}</div>`;
  if(tab==="quiz"){
    html += `<div id="quizHost"></div>`;
  } else {
    const body = DATA.docs[c.docs[tab]];
    html += `<div class="layout"><article class="prose" id="doc">${body}</article><aside class="toc" id="toc"></aside></div>`;
  }
  html += `<div class="pager">${prev?`<a class="btn" href="#/ch/${prev.n}/${tab==="quiz"?"quiz":"notes"}">&larr; Chapter ${prev.n}</a>`:"<span></span>"}${next?`<a class="btn" href="#/ch/${next.n}/${tab==="quiz"?"quiz":"notes"}">Chapter ${next.n} &rarr;</a>`:`<a class="btn primary" href="#/exam">Practice exam &rarr;</a>`}</div>`;
  view().innerHTML = html;
  if(tab==="quiz") Quiz.mount($("#quizHost"), {id:"ch"+c.n, title:`Chapter ${c.n} quiz`, pool:c.quiz, fixed:false});
  else buildToc();
}
function buildToc(){
  const doc = $("#doc"), toc = $("#toc"); if(!doc||!toc) return;
  const hs = [...doc.querySelectorAll("h2")];
  if(hs.length<2){ toc.innerHTML=""; return; }
  hs.forEach((h,i)=>{ if(!h.id) h.id = "s"+i; });
  toc.innerHTML = `<b>On this page</b>` + hs.map(h=>`<a href="javascript:void(0)" data-id="${h.id}">${esc(h.textContent)}</a>`).join("");
  toc.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{const t=document.getElementById(a.dataset.id); if(t) window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-80,behavior:"smooth"});}));
}

/* ---------- review / resources ---------- */
function renderReview(){
  setNav("review");
  let html = `<div class="page-head"><h1>Review</h1><div class="sub">Cross-chapter review material and exam logistics.</div></div><div class="grid">`;
  for(const r of DATA.resources) html += `<div class="card"><div class="num">Review</div><h3>${esc(r.title)}</h3><div class="meta"><span>${esc(r.blurb)}</span></div><div class="links"><a href="#/review/${r.id}">Open</a></div></div>`;
  html += `<div class="card"><div class="num">Practice</div><h3>Question bank (all chapters)</h3><div class="meta"><span>Mixed practice from every chapter with instant feedback.</span></div><div class="links"><a href="#/review/bank">Start</a></div></div>`;
  html += `</div>`;
  view().innerHTML = html;
}
function renderResource(id){
  setNav("review");
  if(id==="bank"){
    const pool = DATA.chapters.flatMap(c=>c.quiz.map(q=>({...q, ch:c.n})));
    view().innerHTML = `<div class="page-head"><div class="crumbs"><a href="#/review">Review</a> / Question bank</div><h1>Question bank</h1><div class="sub">${pool.length} questions across all chapters</div></div><div id="quizHost"></div>`;
    Quiz.mount($("#quizHost"), {id:"bank", title:"Mixed practice", pool, fixed:false, showCh:true});
    return;
  }
  const r = DATA.resources.find(x=>x.id===id); if(!r) return renderReview();
  view().innerHTML = `<div class="page-head"><div class="crumbs"><a href="#/review">Review</a> / ${esc(r.title)}</div><h1>${esc(r.title)}</h1><div class="sub">${esc(r.blurb)}</div></div><div class="layout"><article class="prose" id="doc">${DATA.docs[r.doc]}</article><aside class="toc" id="toc"></aside></div>`;
  buildToc();
}

/* ---------- quiz (instant feedback) ---------- */
const Quiz = {
  mount(host, cfg){
    const st = {cfg, qs:[], i:0, picks:[], phase:"setup", count: cfg.defaultCount || Math.min(20, cfg.pool.length)};
    const draw = () => {
      if(st.phase==="setup") return setup();
      if(st.phase==="q") return question();
      return results();
    };
    function setup(){
      const n = cfg.pool.length;
      const sizes = [10,20,n].filter((v,i,a)=>v<=n && a.indexOf(v)===i);
      const best = store.get(bestKey(cfg.id), null);
      host.innerHTML = `<div class="panel"><h2>${esc(cfg.title)}</h2><div class="muted">${n} questions in this set. Questions and answer choices are shuffled each time, and you see the answer and explanation after every question.${best!=null?` Your best score on this device: <b>${best}%</b>.`:""}</div>
      ${cfg.fixed?"":`<div class="opts-row"><div class="seg" id="seg">${sizes.map(s=>`<button data-n="${s}" class="${s===st.count?"on":""}">${s===n?`All ${n}`:s}</button>`).join("")}</div></div>`}
      <button class="btn primary" id="go" style="margin-top:${cfg.fixed?16:0}px">Start</button></div>`;
      host.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{st.count=+b.dataset.n; setup();});
      host.querySelector("#go").onclick=()=>{
        st.qs = cfg.fixed ? cfg.pool.map(fixedQ) : shuffle(cfg.pool).slice(0,st.count).map(prepQ);
        st.i=0; st.picks=new Array(st.qs.length).fill(null); st.phase="q"; draw();
      };
    }
    function question(){
      const q = st.qs[st.i], pick = st.picks[st.i], done = pick!==null;
      const correct = st.picks.filter((p,j)=>p!==null && p===st.qs[j].answer).length, answered = st.picks.filter(p=>p!==null).length;
      host.innerHTML = `<div class="panel">
        <div class="progress"><i style="width:${(st.i)/st.qs.length*100}%"></i></div>
        <div class="qhead"><span>Question ${st.i+1} of ${st.qs.length}${cfg.showCh&&q.ch?` &middot; Chapter ${q.ch}`:""}</span><span>${answered?`${correct}/${answered} correct`:""}</span></div>
        ${q.topic?`<div style="margin-bottom:10px"><span class="qhead qtopic" style="display:inline-block;margin:0">${esc(q.topic)}</span></div>`:""}
        <p class="qtext">${esc(q.q)}</p>
        <div class="choices">${q.options.map((o,j)=>{
          let cls = ""; if(done){ if(j===q.answer) cls="right"; else if(j===pick) cls="wrong"; }
          return `<button class="choice ${cls}" data-j="${j}" ${done?"disabled":""}><span class="k">${L(j)}</span><span>${esc(o)}</span></button>`;}).join("")}</div>
        ${done?`<div class="expl ${pick===q.answer?"ok":"no"}"><b>${pick===q.answer?"Correct.":"Not quite. The answer is "+L(q.answer)+"."}</b>${esc(q.explanation||"")}</div>`:""}
        <div class="qnav"><button class="btn" id="quit">End quiz</button><span><span class="muted" style="margin-right:10px">${done?'<span class="kbd">Enter</span> next':'<span class="kbd">A</span>-<span class="kbd">D</span> to answer'}</span><button class="btn primary" id="next" ${done?"":"disabled"}>${st.i===st.qs.length-1?"See results":"Next"}</button></span></div>
      </div>`;
      host.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ if(st.picks[st.i]!==null) return; st.picks[st.i]=+b.dataset.j; question(); });
      host.querySelector("#next").onclick=()=>{ if(st.i<st.qs.length-1){st.i++; question(); window.scrollTo(0,host.offsetTop-90);} else {st.phase="done"; draw();} };
      host.querySelector("#quit").onclick=()=>{ st.phase="done"; draw(); };
    }
    function results(){
      const answered = st.qs.map((q,j)=>({q, p:st.picks[j]})).filter(x=>x.p!==null);
      const right = answered.filter(x=>x.p===x.q.answer).length;
      const pct = answered.length ? Math.round(right/answered.length*100) : 0;
      if(answered.length >= Math.min(10, st.qs.length) && !cfg.noBest){ const b = store.get(bestKey(cfg.id), null); if(b==null || pct>b) store.set(bestKey(cfg.id), pct); }
      const missed = answered.filter(x=>x.p!==x.q.answer);
      host.innerHTML = `<div class="panel"><h2>Results</h2>
        <div class="score-big ${pct>=70?"pass":"fail"}">${pct}%</div>
        <div class="muted">${right} of ${answered.length} answered correctly${answered.length<st.qs.length?` (${st.qs.length-answered.length} not answered)`:""}. The state exam passing score is 70%.</div>
        <div class="opts-row">${missed.length?`<button class="btn primary" id="retryMissed">Retry the ${missed.length} missed</button>`:""}<button class="btn" id="again">New quiz</button></div>
        ${missed.length?`<h3 style="margin:18px 0 0;font-size:16px">Review missed questions</h3>`+missed.map(x=>reviewItem(x.q,x.p)).join(""):`<p class="muted">No misses. Nice work.</p>`}
      </div>`;
      const rm = host.querySelector("#retryMissed");
      if(rm) rm.onclick=()=>{ st.qs = shuffle(missed.map(x=>x.q)).map(q=>cfg.fixed?q:prepQ(q)); st.i=0; st.picks=new Array(st.qs.length).fill(null); st.phase="q"; draw(); };
      host.querySelector("#again").onclick=()=>{ st.phase="setup"; draw(); };
    }
    const onKey = e => {
      if(st.phase!=="q" || e.target.tagName==="INPUT") return;
      const k = e.key.toUpperCase();
      if("ABCD".includes(k) && k.length===1){ const b = host.querySelector(`.choice[data-j="${"ABCD".indexOf(k)}"]`); if(b && !b.disabled) b.click(); }
      if(e.key==="Enter"){ const n = host.querySelector("#next"); if(n && !n.disabled){ e.preventDefault(); n.click(); } }
    };
    document.addEventListener("keydown", onKey);
    cleanup = () => document.removeEventListener("keydown", onKey);
    draw();
  }
};
function reviewItem(q, p){
  return `<div class="review-item"><div class="q">${esc(q.q)}</div><div class="a">
    ${p===null?`<div class="tag-no">Not answered</div>`:p===q.answer?`<div class="tag-ok">Your answer: ${L(p)}. ${esc(q.options[p])}</div>`:`<div class="tag-no">Your answer: ${L(p)}. ${esc(q.options[p])}</div>`}
    ${p!==q.answer?`<div class="tag-ok">Correct: ${L(q.answer)}. ${esc(q.options[q.answer])}</div>`:""}
    <div style="margin-top:6px">${esc(q.explanation||"")}</div></div></div>`;
}

/* ---------- practice exam ---------- */
function buildExam(ex){
  if(ex.fixed) return ex.questions.map(fixedQ);
  const out = [], rest = [];
  let target = 0;
  for(const [n, k] of Object.entries(ex.blueprint)){
    target += k;
    const c = chapter(+n); if(!c) continue;
    const s = shuffle(c.quiz);
    s.slice(0, k).forEach(q=>out.push(prepQ({...q, ch:+n})));
    s.slice(k).forEach(q=>rest.push({...q, ch:+n}));
  }
  shuffle(rest).slice(0, Math.max(0, target-out.length)).forEach(q=>out.push(prepQ(q)));
  return shuffle(out);
}
function renderExamHub(id){
  setNav("exam");
  if(id){ const ex = DATA.exams.find(e=>e.id===id); if(ex) return Exam.start(ex); }
  if(DATA.exams.length===1) return Exam.start(DATA.exams[0]);
  let html = `<div class="page-head"><h1>Practice exams</h1><div class="sub">Full-length practice in exam conditions or study mode.</div></div><div class="grid">`;
  for(const ex of DATA.exams) html += `<div class="card feature"><div class="num">Practice exam</div><h3>${esc(ex.title)}</h3><div class="meta"><span>${esc(ex.blurb)}</span></div><div class="links"><a href="#/exam/${ex.id}">Start</a></div></div>`;
  view().innerHTML = html + `</div>`;
}
const Exam = {
  start(ex){
    const host = view();
    const st = {ex, mode:"timed", qs:[], picks:[], flags:[], i:0, end:0, timer:null, phase:"setup"};
    const fmt = s => { s=Math.max(0,s|0); const h=s/3600|0, m=(s%3600)/60|0, x=s%60; return `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`; };
    function setup(){
      const n = ex.fixed ? ex.questions.length : Object.values(ex.blueprint).reduce((a,b)=>a+b,0);
      host.innerHTML = `<div class="page-head"><div class="crumbs"><a href="#/exam">Practice exams</a></div><h1>${esc(ex.title)}</h1><div class="sub">${esc(ex.blurb)}</div></div>
      <div class="panel"><h2>Choose a mode</h2><div class="muted">${n} questions${ex.fixed?"":", drawn fresh each attempt and weighted like the state exam content outline"}. Passing score: 70%.</div>
      <div class="opts-row"><div class="seg" id="mode"><button data-m="timed" class="${st.mode==="timed"?"on":""}">Exam mode (${fmt(ex.minutes*60)})</button><button data-m="study" class="${st.mode==="study"?"on":""}">Study mode</button></div></div>
      <div class="muted" style="margin-bottom:16px">${st.mode==="timed"?"Timed, like the real test. No feedback until you submit. Flag questions to come back to them.":"Untimed. See the answer and explanation after each question."}</div>
      <button class="btn primary" id="go">Start</button></div>`;
      host.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m; setup();});
      host.querySelector("#go").onclick=()=>{
        st.qs = buildExam(ex);
        if(st.mode==="study"){ host.innerHTML = `<div class="page-head"><div class="crumbs"><a href="#/exam">Practice exams</a></div><h1>${esc(ex.title)}</h1><div class="sub">Study mode</div></div><div id="quizHost"></div>`;
          return Quiz.mount($("#quizHost"), {id:"exam-"+ex.id, title:ex.title+" (study mode)", pool:st.qs, fixed:true, showCh:true, noBest:true});
        }
        st.picks = new Array(st.qs.length).fill(null); st.flags = new Array(st.qs.length).fill(false); st.i=0; st.phase="q";
        st.end = Date.now() + ex.minutes*60*1000;
        st.timer = setInterval(tick, 1000);
        cleanup = () => { clearInterval(st.timer); document.removeEventListener("keydown", onKey); window.onbeforeunload = null; };
        document.addEventListener("keydown", onKey);
        window.onbeforeunload = () => "Your exam is in progress.";
        draw();
      };
    }
    function tick(){ const left = (st.end-Date.now())/1000; const t = $("#timer"); if(t){ t.textContent = fmt(left); t.classList.toggle("low", left<600); } if(left<=0){ submit(true); } }
    function draw(){
      const q = st.qs[st.i], pick = st.picks[st.i];
      const answered = st.picks.filter(p=>p!==null).length;
      host.innerHTML = `<div class="exam-wrap"><div class="panel" style="max-width:none">
        <div class="progress"><i style="width:${answered/st.qs.length*100}%"></i></div>
        <div class="qhead"><span>Question ${st.i+1} of ${st.qs.length}</span><button class="btn sm flagbtn ${st.flags[st.i]?"on":""}" id="flag">${st.flags[st.i]?"Flagged":"Flag for review"}</button></div>
        <p class="qtext">${esc(q.q)}</p>
        <div class="choices">${q.options.map((o,j)=>`<button class="choice ${pick===j?"sel":""}" data-j="${j}"><span class="k">${L(j)}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div class="qnav"><button class="btn" id="prev" ${st.i===0?"disabled":""}>&larr; Previous</button><button class="btn primary" id="next">${st.i===st.qs.length-1?"Review and submit":"Next &rarr;"}</button></div>
      </div>
      <aside class="exam-side panel" style="padding:18px"><div class="muted">Time remaining</div><div class="timer" id="timer">${fmt((st.end-Date.now())/1000)}</div>
        <div class="muted">${answered} of ${st.qs.length} answered</div>
        <div class="legend"><span class="l-a">Answered</span><span class="l-f">Flagged</span></div>
        <div class="qgrid">${st.qs.map((_,j)=>`<button data-j="${j}" class="${st.picks[j]!==null?"ans":""} ${st.flags[j]?"flag":""} ${j===st.i?"cur":""}">${j+1}</button>`).join("")}</div>
        <button class="btn primary block" id="submit" style="margin-top:14px">Submit exam</button>
      </aside></div>`;
      host.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ st.picks[st.i]=+b.dataset.j; draw(); });
      host.querySelectorAll(".qgrid button").forEach(b=>b.onclick=()=>{ st.i=+b.dataset.j; draw(); });
      host.querySelector("#flag").onclick=()=>{ st.flags[st.i]=!st.flags[st.i]; draw(); };
      host.querySelector("#prev").onclick=()=>{ if(st.i>0){st.i--; draw();} };
      host.querySelector("#next").onclick=()=>{ if(st.i<st.qs.length-1){st.i++; draw();} else confirmSubmit(); };
      host.querySelector("#submit").onclick=confirmSubmit;
    }
    function confirmSubmit(){
      const un = st.picks.filter(p=>p===null).length, fl = st.flags.filter(Boolean).length;
      if(un || fl){ if(!confirm(`${un?un+" unanswered":""}${un&&fl?" and ":""}${fl?fl+" flagged":""}. Submit anyway?`)) return; }
      submit(false);
    }
    function submit(timeUp){
      clearInterval(st.timer); window.onbeforeunload = null; document.removeEventListener("keydown", onKey);
      const right = st.qs.filter((q,j)=>st.picks[j]===q.answer).length, pct = Math.round(right/st.qs.length*100);
      const byCh = {};
      st.qs.forEach((q,j)=>{ const k = q.ch||"Mixed"; byCh[k] = byCh[k]||{t:0,r:0}; byCh[k].t++; if(st.picks[j]===q.answer) byCh[k].r++; });
      const rows = Object.entries(byCh).sort((a,b)=>(+a[0])-(+b[0])).map(([k,v])=>{ const c = chapter(+k); return `<tr><td>${c?`Ch ${c.n}. ${esc(c.title)}`:esc(k)}</td><td>${v.r}/${v.t}</td><td>${Math.round(v.r/v.t*100)}%</td></tr>`; }).join("");
      const missed = st.qs.map((q,j)=>({q,p:st.picks[j]})).filter(x=>x.p!==x.q.answer);
      host.innerHTML = `<div class="panel" style="max-width:none"><h2>${timeUp?"Time is up":"Exam submitted"}</h2>
        <div class="score-big ${pct>=70?"pass":"fail"}">${pct}%</div>
        <div class="muted">${right} of ${st.qs.length} correct. ${pct>=70?"That's a passing score (70% or higher).":"Below the 70% passing score."}</div>
        ${Object.keys(byCh).length>1?`<h3 style="font-size:16px;margin:20px 0 0">By chapter</h3><table class="breakdown"><tr><th>Chapter</th><th>Correct</th><th>Score</th></tr>${rows}</table>`:""}
        <div class="opts-row"><button class="btn primary" id="again">Take another</button>${missed.length?`<button class="btn" id="practiceMissed">Practice the ${missed.length} missed</button>`:""}</div>
        ${missed.length?`<h3 style="font-size:16px;margin:18px 0 0">Review missed questions</h3>`+missed.map(x=>reviewItem(x.q,x.p)).join(""):""}
      </div>`;
      host.querySelector("#again").onclick=()=>{ st.phase="setup"; setup(); };
      const pm = host.querySelector("#practiceMissed");
      if(pm) pm.onclick=()=>{ host.innerHTML = `<div id="quizHost"></div>`; Quiz.mount($("#quizHost"), {id:"exam-missed", title:"Missed questions", pool:missed.map(x=>x.q), fixed:true, showCh:true, noBest:true}); };
      window.scrollTo(0,0);
    }
    const onKey = e => {
      if(st.phase!=="q") return;
      const k = e.key.toUpperCase();
      if(k.length===1 && "ABCD".includes(k)){ st.picks[st.i]="ABCD".indexOf(k); draw(); }
      else if(e.key==="ArrowRight" && st.i<st.qs.length-1){ st.i++; draw(); }
      else if(e.key==="ArrowLeft" && st.i>0){ st.i--; draw(); }
    };
    setup();
  }
};
})();
</script>
